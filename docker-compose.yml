services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: labmind
      POSTGRES_PASSWORD: labmind
      POSTGRES_DB: labmind
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://labmind:labmind@db:5432/labmind
    volumes: ["./backend:/app"]
    depends_on: [db]

volumes:
  pgdata: